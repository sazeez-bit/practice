<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form one</title>
    <link rel="stylesheet" href="log form.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <section class="form">
      <form action="">
        <div class="head">
          <h1>Welcome back</h1>
          <p>Enter your credentials</p>
        </div>

        <div class="same">
          <label for="eaddress">Email address</label>
          <input
            type="email"
            id="eadress"
            name="email-address"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="same">
          <label for="pin">Password</label>
          <input type="password" id="pin" name="pass" placeholder="........." />
        </div>

        <div class="cbox">
          <p><input type="checkbox" />Remember me</p>
          <a href="#">Forgot password?</a>
        </div>

        <button class="btn">Sign in</button>

        <div class="divider">
          <span>OR</span>
        </div>

        <section class="icon-container">
          <button class="icon">
            <i
              class="fa-brands fa-facebook fa-xl"
              style="color: rgb(255, 212, 59)"
            ></i>
          </button>

          <button class="icon">
            <i
              class="fa-brands fa-google fa-xl"
              style="color: rgb(255, 212, 59)"
            ></i>
          </button>

          <button class="icon">
            <i
              class="fa-brands fa-instagram fa-xl"
              style="color: rgb(255, 212, 59)"
            ></i>
          </button>
        </section>

        <div class="sup">
          <p>Don't have an account?<a>Sign Up</a></p>
        </div>
      </form>
    </section>
  </body>
</html>
